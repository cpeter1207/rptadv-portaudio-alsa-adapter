name: Release

on:
  push:
    tags: ['v*']

permissions:
  checks: read
  contents: write
  pull-requests: read

jobs:
  release:
    uses: cpeter1207/rptadv-portaudio-alsa-adapter-workflows/.github/workflows/release.yml@main
    with:
      code_ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}
